<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Autentikasi - Login</title>
    <!-- Penulisan CSS menggunakan cara eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Elemen Semantik Utama -->
    <main class="auth-container">

        <!-- KOLOM KIRI: Artwork & Branding (Split-Screen) -->
        <section class="brand-section" aria-label="Branding dan Artwork">
            <div class="brand-content">
                <div class="artwork-wrapper">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" alt="Ilustrasi Autentikasi Modern" class="brand-illustration">
                </div>
                <div class="brand-text">
                    <h1>Kelola Aktivitas MICE Anda Lengkap & Mudah</h1>
                    <p>Bergabunglah dengan platform manajemen acara dan konvensi terintegrasi.</p>
                </div>
            </div>
        </section>

        <!-- KOLOM KANAN: Formulir Login -->
        <section class="form-section" aria-label="Formulir Login">
            <div class="form-wrapper">

                <!-- Logo Perusahaan -->
                <header class="form-header">
                    <img src="https://api.iconify.design/lucide:layers.svg?color=%232563eb" alt="Logo Aplikasi" class="app-logo" width="40" height="40">
                    <h2>Selamat Datang Kembali</h2>
                    <p class="subtitle">Silakan masuk menggunakan akun Anda</p>
                </header>

                <!-- Tombol SSO dengan Aksesibilitas (aria-label) -->
                <button type="button" class="btn-sso" aria-label="Sign in with Google">
                    <svg class="sso-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <!-- Pemisah / Divider Alternative -->
                <div class="divider" role="separator" aria-label="atau masuk dengan email">
                    <span class="divider-text">or</span>
                </div>

                <!-- Formulir Login Semantik -->
                <form action="#" method="POST" class="auth-form" novalidate>

                    <!-- Input Email/Username -->
                    <div class="form-group">
                        <label for="username-email">Email / Username</label>
                        <input 
                            type="text" 
                            id="username-email" 
                            name="username_email" 
                            placeholder="nama@email.com atau username" 
                            required 
                            autocomplete="username"
                        >
                    </div>

                    <!-- Input Password + Link Forgot Password -->
                    <div class="form-group">
                        <div class="label-row">
                            <label for="user-password">Password</label>
                            <a href="#forgot-password" class="forgot-password-link">Forgot Password?</a>
                        </div>
                        <input 
                            type="password" 
                            id="user-password" 
                            name="password" 
                            placeholder="Masukkan password Anda" 
                            required 
                            autocomplete="current-password"
                        >
                    </div>

                    <!-- Checkbox Remember Me -->
                    <div class="form-options">
                        <label class="checkbox-label" for="remember-me">
                            <input type="checkbox" id="remember-me" name="remember_me">
                            <span class="custom-checkbox"></span>
                            <span class="checkbox-text">Remember Me</span>
                        </label>
                    </div>

                    <!-- Tombol Eksekusi Utama -->
                    <button type="submit" class="btn-primary">Sign In</button>

                </form>

            </div>
        </section>

    </main>

</body>
</html>
